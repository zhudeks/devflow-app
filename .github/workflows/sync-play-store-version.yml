name: Sync Google Play version

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-play-store-version
  cancel-in-progress: false

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Play Developer API
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher,https://www.googleapis.com/auth/devstorage.read_only

      - name: Sync production version
        run: node scripts/sync-play-store-version.mjs
        env:
          PLAY_API_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}

      - name: Publish version update
        run: |
          if git diff --quiet -- app-version.json; then
            echo "The site already has the latest production version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json
          git commit -m "Update Google Play version"
          git push origin HEAD:main
